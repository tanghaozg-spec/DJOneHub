name: build-ipa

# 云端打包未签名 IPA：推送到 main 或手动触发。
# 产出的 IPA 未签名，需用 Sideloadly / AltStore / 爱思助手 + Apple ID 重签后安装。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iPadOS/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iOS" || true

      - name: Build app (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project iPadOS/DJOneHub-iPad.xcodeproj \
            -scheme DJOneHub-iPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/DJOneHub-iPad.app"
          test -d "$APP" || { echo "app bundle not found"; exit 1; }
          rm -rf Payload DJOneHub-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DJOneHub-unsigned.ipa Payload
          ls -lh DJOneHub-unsigned.ipa
          shasum -a 256 DJOneHub-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJOneHub-ipa-unsigned
          path: DJOneHub-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/Logs/**/*.xcactivitylog
          if-no-files-found: ignore
