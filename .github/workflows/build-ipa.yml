name: build-ipa

# 云端打包未签名 IPA：推送到 main 或手动触发。
# 产出的 IPA 未签名，需用 Sideloadly / AltStore / 爱思助手 + Apple ID 重签后安装。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iPadOS/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iOS" || true

      - name: Prepare module-update.djupdate placeholder
        run: |
          # 仓库不含 Ed25519 私钥，无法生成可验证的签名更新包（*.djupdate 被 .gitignore 排除）。
          # 占位包仅满足构建期资源检查；模块端已预装 Agent，App 内更新会因签名校验失败被安全跳过。
          mkdir -p iPadOS/DJOneHub-iPad/Resources
          tar -czf iPadOS/DJOneHub-iPad/Resources/module-update.djupdate -T /dev/null

      - name: Build app (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project iPadOS/DJOneHub-iPad.xcodeproj \
            -scheme DJOneHub-iPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "app bundle not found"; ls -R build/Build/Products || true; exit 1; }
          echo "APP=$APP"
          rm -rf Payload DJOneHub-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DJOneHub-unsigned.ipa Payload
          ls -lh DJOneHub-unsigned.ipa
          shasum -a 256 DJOneHub-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJOneHub-ipa-unsigned
          path: DJOneHub-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/Logs/**/*.xcactivitylog
          if-no-files-found: ignore
